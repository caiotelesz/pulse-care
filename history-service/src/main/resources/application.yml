spring:
  application:
    name: history-service

  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5433/pulse_care_history
    driverClassName: org.postgresql.Driver
    username: pulsecare
    password: pulsecare

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # GraphQL Configuration
  graphql:
    graphiql:
      enabled: true
    schema:
      locations: classpath:graphql/

server:
  port: 8083

rabbitmq:
  queue:
    appointment-history: appointment-history-queue
  exchange:
    appointment: appointment-exchange
  routing:
    key:
      appointment: appointment.created
